apiVersion: batch/v1
kind: Job
metadata:
  name: parallel
spec:
  parallelism: 5 # use max 5 pods
  completions: 10 # until 10 completions
  template:
    spec:
      containers:
      - name: kuard
        image: gcr.io/kuar-demo/kuard-amd64:blue
        imagePullPolicy: Always
        command:
        - "/kuard"
        args:
        - "--keygen-enable"
        - "--keygen-exit-on-complete"
        - "--keygen-num-to-gen=10"
      restartPolicy: "OnFailure"
